name: Frontend CI

# Runs on every PR into develop or main that touches the frontend, and after merges.
# Vercel only builds the app; this is what also runs lint, formatting and the tests.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Our own folders only: src/components/ui is generated by shadcn and must not be reformatted.
      - name: Formatting
        run: npx prettier --check src/api src/app src/components/common src/features src/hooks src/lib src/mocks src/test src/types

      - name: Tests
        run: npm test

      # Includes the type check (tsc -b).
      - name: Build
        run: npm run build
