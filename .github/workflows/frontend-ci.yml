name: Frontend CI

# Runs on every PR into develop or main, and after merges. Vercel only builds the app; this is
# what also runs lint, formatting and the tests.
# There is no `paths:` filter on purpose: a check that GitHub requires but that is skipped for a
# PR (say a backend-only one) would leave that PR waiting for it forever.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A name of its own: the backend job is also called "check", and this is the name to require.
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Our own folders only: src/components/ui is generated by shadcn and must not be reformatted.
      - name: Formatting
        run: npx prettier --check src/api src/app src/components/common src/features src/hooks src/lib src/mocks src/test src/types

      - name: Tests
        run: npm test

      # Includes the type check (tsc -b).
      - name: Build
        run: npm run build
